# Прод ProdTrack на новом сервере: prodtrack.vegas-ai.ru → 127.0.0.1:3000
#
# Это ШАБЛОН для первой установки. Порядок:
#   1. cp docs/nginx/prodtrack.vegas-ai.ru.conf /etc/nginx/sites-available/
#      ln -sf /etc/nginx/sites-available/prodtrack.vegas-ai.ru.conf /etc/nginx/sites-enabled/
#   2. защита от сканеров: cp docs/nginx/snippets/prodtrack-junk-paths.conf /etc/nginx/snippets/
#   3. сертификат: certbot --nginx -d prodtrack.vegas-ai.ru
#      certbot допишет блок `listen 443 ssl` — после этого файл из репозитория поверх
#      рабочего НЕ копировать (затрёт SSL и сломает HTTPS).
#
# Стендов на этом сервере нет: пароль стенда не нужен, только защита от сканеров.

server {
    listen 80;
    server_name prodtrack.vegas-ai.ru;

    client_max_body_size 50M;

    # Мусорные пути (wp-admin, .env, xmlrpc и т.п.) закрываем сразу, не доходя до приложения:
    # на маленьком сервере сканеры заметны. Файл сниппета — в репозитории.
    include /etc/nginx/snippets/prodtrack-junk-paths.conf;

    # SSE-каналы: уведомления (/api/events/notifications) и дашборд (/api/events/dashboard)
    # идут по одному префиксу. Буферизацию выключаем, иначе кадры копятся в прокси
    # и real-time перестаёт работать; read_timeout большой, сервер шлёт keep-alive.
    location /api/events/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Блок HTTPS добавляет certbot (для справки):
#
# server {
#     listen 443 ssl; # managed by Certbot
#     server_name prodtrack.vegas-ai.ru;
#     ssl_certificate /etc/letsencrypt/live/prodtrack.vegas-ai.ru/fullchain.pem; # managed by Certbot
#     ssl_certificate_key /etc/letsencrypt/live/prodtrack.vegas-ai.ru/privkey.pem; # managed by Certbot
#     include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
#
#     client_max_body_size 50M;
#     # ... те же location /api/events/ и location / ...
# }
