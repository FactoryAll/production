# Пароль на стенд (ОПЭ-63, решение владельца 26.10.2026).
#
# Раньше стенды закрывались списком адресов. Адрес у провайдера плавает (26.10.2026 он сменился
# с 185.253.183.61 на 185.253.180.220), и стенд «отваливался» с 403 до тех пор, пока список
# не поправят руками. Пароль не зависит от адреса и не требует обслуживания.
#
# Ставится в server-блок дев- и фикс-стенда:
#     include /etc/nginx/snippets/prodtracker-dev-allow.conf;   # имя оставлено прежним
#     include /etc/nginx/snippets/prodtracker-fix-allow.conf;   # чтобы не править сайты
#
# Файл с логином и хешем пароля — /etc/nginx/.htpasswd-prodtrack (см. docs/deploy_vps.md).

# Проверка сертификата должна проходить всегда — иначе продление упрётся в пароль.
location /.well-known/acme-challenge/ {
    auth_basic off;
    allow all;
}

auth_basic "ProdTrack: стенд";
auth_basic_user_file /etc/nginx/.htpasswd-prodtrack;
