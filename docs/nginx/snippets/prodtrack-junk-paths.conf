# Мусорные пути сканеров (ОПЭ-18/v2.2.1).
#
# Интернет постоянно обходит сайты по типовым адресам: /wp-login.php, /.env, /xmlrpc.php,
# /boaform/admin/formLogin, /geoserver/web, /device.rsp и подобное. Нашему приложению
# эти пути не нужны никогда. Отвечаем 444 — nginx закрывает соединение, не отдавая
# ни заголовков, ни тела, и не пишет строку в access.log: сканер не получает
# ни ответа, ни признака, что сайт жив, а мы не тратим на него диск и CPU.
#
# Вставляется в server-блок ПЕРЕД `location /`:
#     include /etc/nginx/snippets/prodtrack-junk-paths.conf;
#
# Живые адреса приложения не задевает: шаблон привязан к началу пути.

location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|\.env|\.git|boaform|geoserver|manager/text|device\.rsp|ecp/|\.well-known/acme-challenge-wrong|config\.json|README\.md|CLAUDE\.md|AGENTS\.md|\.github/) {
    access_log off;
    return 444;
}
