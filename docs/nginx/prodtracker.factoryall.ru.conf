server {
    listen 80;
    server_name prodtracker.factoryall.ru;

    client_max_body_size 50M;

    # SSE-канал уведомлений (M09, /api/events/notifications, с v1.2.0):
    # буферизацию обязательно отключаем, иначе кадры копятся в буфере прокси
    # и real-time перестаёт работать. proxy_read_timeout увеличен, чтобы
    # соединение не рвалось на простое (сервер шлёт keep-alive каждые 15 с).
    location /api/events/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
