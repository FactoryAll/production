# ВНИМАНИЕ: это ШАБЛОН для первой установки сайта.
# Если сайт уже настроен на сервере, файл /etc/nginx/sites-available/prodtracker.factoryall.ru.conf
# содержит блок `listen 443 ssl` с сертификатом, добавленный certbot. Копирование этого шаблона
# поверх рабочего файла ЗАТИРАЕТ SSL-блок и ломает HTTPS (проверено 03.10.2026: домен начинал
# отдавать чужой сертификат, в браузере — белый экран).
#
# Для добавления SSE-канала (M09) вставьте только блок `location /api/events/` в существующий конфиг,
# либо повторно выполните: certbot --nginx -d prodtracker.factoryall.ru --non-interactive --agree-tos

server {
    listen 80;
    server_name prodtracker.factoryall.ru;

    client_max_body_size 50M;

    # SSE-канал уведомлений (M09, /api/events/notifications, с v1.2.0):
    # буферизацию обязательно отключаем, иначе кадры копятся в буфере прокси
    # и real-time перестаёт работать. proxy_read_timeout увеличен, чтобы
    # соединение не рвалось на простое (сервер шлёт keep-alive каждые 15 с).
    location /api/events/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Блок HTTPS добавляет certbot (шаблон для справки):
#
# server {
#     listen 443 ssl; # managed by Certbot
#     server_name prodtracker.factoryall.ru;
#     ssl_certificate /etc/letsencrypt/live/prodtracker.factoryall.ru/fullchain.pem; # managed by Certbot
#     ssl_certificate_key /etc/letsencrypt/live/prodtracker.factoryall.ru/privkey.pem; # managed by Certbot
#     include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
#
#     client_max_body_size 50M;
#     # ... те же location /api/events/ и location / ...
# }
