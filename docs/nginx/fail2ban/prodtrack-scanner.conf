# Фильтр fail2ban для ProdTrack (ОПЭ-18/v2.2.1).
#
# Ловит два класса автоматического мусора:
#   1. обход по типовым путям сканеров (WordPress, .env, xmlrpc, geoserver, device.rsp);
#   2. битые запросы — сканеры шлют в HTTP-порт TLS-рукопожатие и мусорные байты,
#      nginx отвечает 400 (20.10.2026 таких было 336 за день с одной сети).
#
# Формат access.log — стандартный combined:
#   1.2.3.4 - - [20/Oct/2026:02:22:27 +0000] "GET /wp-login.php HTTP/1.1" 404 166 "-" "-"

[Definition]
failregex = ^<HOST> - - \[[^\]]+\] "(?:GET|POST|HEAD|PUT|OPTIONS|CONNECT) /(?:wp-|xmlrpc\.php|\.env|\.git|boaform|geoserver|manager/text|device\.rsp|ecp/|config\.json|README\.md)[^"]*"
            ^<HOST> - - \[[^\]]+\] "[^"]*" 400 
ignoreregex =
