# Дев-стенд ProdTrack: prodtracker-dev.factoryall.ru → 127.0.0.1:3001
#
# ВНИМАНИЕ: серверных стендов больше нет — на нынешнем сервере (1 ГБ) поднимается только прод,
# а дев-стенд проверяется локально (docs/deploy_timeweb.md). Шаблон сохранён на случай,
# если стенд когда-нибудь вернут на отдельную машину.
#
# Это ШАБЛОН для первой установки. Порядок:
#   1. A-запись prodtracker-dev.factoryall.ru → IP сервера (владелец/DNS).
#   2. Скопировать этот файл в /etc/nginx/sites-available/prodtracker-dev.factoryall.ru.conf,
#      симлинк в sites-enabled, nginx -t && systemctl reload nginx.
#   3. Выпустить сертификат: certbot --nginx -d prodtracker-dev.factoryall.ru --non-interactive --agree-tos
#      certbot сам добавит блок `listen 443 ssl` — после этого файл из репозитория НЕ копировать
#      поверх рабочего (затрёт SSL и сломает HTTPS).
#
# Порт 3001 — дев-стенд (прод слушает 3000). Проверить после поднятия:
#   curl -sI http://127.0.0.1:3001/login | head -1

# Пароль стенда (ОПЭ-63). Без этой строки стенд открыт в интернет — и именно так он
# поднимается, если следовать только этому шаблону. Сниппет кладётся по пути ниже:
#   cp docs/nginx/snippets/prodtracker-stand-auth.conf /etc/nginx/snippets/prodtracker-dev-allow.conf
#   htpasswd -c /etc/nginx/.htpasswd-prodtrack prodtrack
server {
    listen 80;
    server_name prodtracker-dev.factoryall.ru;

    client_max_body_size 50M;

    # Пароль на весь стенд (см. комментарий выше).
    include /etc/nginx/snippets/prodtracker-dev-allow.conf;

    # SSE-канал уведомлений: буферизацию выключаем, иначе кадры копятся в прокси.
    # SSE-канал уведомлений (M09): /api/events/notifications.
    # По этому же префиксу идёт и канал дашборда (/api/events/dashboard): отдельного location
    # для него не нужно, буферизация выключена для всего /api/events/.
    location /api/events/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Закрыть дев-стенд от посторонних. Дев — не для пользователей: пусть смотрит
# только владелец и разработчик. Достаточно ограничить по адресам (раскомментировать
# внутри server-блока и вписать свои):
#
#     allow 92.51.14.75;      # пример: адрес офисного выхода
#     deny all;
#
# Пока ограничения нет — стенд виден всем, у кого есть ссылка, и вход в него
# открыт тем же учётным записям, что и в прод (сид создаёт admin/admin123).
