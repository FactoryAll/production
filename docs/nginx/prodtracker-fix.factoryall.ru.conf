# Фикс-стенд ProdTrack: prodtracker-fix.factoryall.ru → 127.0.0.1:3002
#
# Это ШАБЛОН для первой установки. Порядок:
#   1. A-запись prodtracker-fix.factoryall.ru → IP сервера (владелец/DNS).
#   2. Скопировать этот файл в /etc/nginx/sites-available/prodtracker-fix.factoryall.ru.conf,
#      симлинк в sites-enabled, nginx -t && systemctl reload nginx.
#   3. Выпустить сертификат: certbot --nginx -d prodtracker-fix.factoryall.ru --non-interactive --agree-tos
#      certbot сам добавит блок `listen 443 ssl` — после этого файл из репозитория НЕ копировать
#      поверх рабочего (затрёт SSL и сломает HTTPS).
#
# Порт 3002 — фикс-стенд (прод слушает 3000). Проверить после поднятия:
#   curl -sI http://127.0.0.1:3002/login | head -1

server {
    listen 80;
    server_name prodtracker-fix.factoryall.ru;

    client_max_body_size 50M;

    # SSE-канал уведомлений: буферизацию выключаем, иначе кадры копятся в прокси.
    location /api/events/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Фикс-стенд закрыт списком адресов, как дев: он не для пользователей.
#
#     allow 92.51.14.75;      # пример: адрес офисного выхода
#     deny all;
